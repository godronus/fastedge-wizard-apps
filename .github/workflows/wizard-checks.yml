# IMPORTANT — fork PR security (public repo)
#
# This workflow runs on `pull_request`, which means it executes contributed code
# (pnpm run build, pnpm test:e2e) on our runners for every fork PR. To prevent
# runner abuse (crypto mining, etc.) from arbitrary contributors, you MUST enable:
#
#   Repo → Settings → Actions → General
#   → "Fork pull request workflows from outside collaborators"
#   → "Require approval for all outside collaborators"
#
# Without that setting, any actor can fork this repo, open a PR, and trigger a
# runner job immediately. With it, a maintainer must approve before any job runs.
# `permissions: contents: read` below limits the GITHUB_TOKEN scope as defence-in-depth,
# but it does NOT prevent jobs from starting — the Settings gate is the primary control.
name: Wizard checks

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'wizards/**/src/**'
      - 'wizards/**/package.json'
      - 'packages/**' # shared step-kit — bundled into every React wizard
      - 'e2e/**' # spec + committed snapshots
      - 'playwright.config.ts'
      - '.stylelintrc.json'

jobs:
  stylelint:
    name: Stylelint — no raw colours
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: ./.github/setup-node

      - name: Lint CSS
        run: pnpm lint:css

  visual-and-a11y:
    name: Screenshot diff + axe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: ./.github/setup-node

      - name: Build wizards
        run: pnpm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual + a11y tests
        run: pnpm test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
